packages:
  - apps/*
  - packages/*

# One version of each shared dependency for the whole repo. Packages say `catalog:` instead of a version.
catalog:
  'react': ^19.3.0
  'react-dom': ^19.3.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  'typescript': ^5.9.3
  'vite': ^8.3.4
  'vitest': ^5.1.0
  'jsdom': ^31.0.0
  '@vitejs/plugin-react': ^6.1.2
  'tailwindcss': ^4.3.4
  '@tailwindcss/vite': ^4.3.4
  '@types/node': ^24.19.2
  'clsx': ^2.1.1
  'tailwind-merge': ^3.7.0
  'class-variance-authority': ^0.7.1
  'tw-animate-css': ^1.4.0
  'zod': ^4.6.7
  '@testing-library/jest-dom': ^7.0.1
  '@testing-library/react': ^16.3.3
  '@vitest/coverage-v8': ^5.1.0

allowBuilds:
  electron-winstaller: false
  esbuild: true
  workerd: true

# Keep hono one release behind while 4.13.17 is younger than the supply-chain age guard (minimumReleaseAge).
overrides:
  hono: 4.13.16

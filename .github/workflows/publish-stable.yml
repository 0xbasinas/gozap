name: Publish stable release
# Pushes to main that change the app (src, build, package.json and build config) are tested,
# then built for Windows, macOS and Linux and published as a normal release.
on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/src/**'
      - '!apps/desktop/src/**/*.test.ts'
      - '!apps/desktop/src/**/*.test.tsx'
      - 'apps/desktop/build/**'
      - 'apps/desktop/resources/**'
      - 'apps/desktop/package.json'
      - 'apps/desktop/electron-builder.yml'
      - 'apps/desktop/electron.vite.config.ts'
      - 'packages/**'
      - '!packages/**/*.test.ts'
      - '!packages/**/*.test.tsx'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: publish-stable
  cancel-in-progress: false

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    needs: ci
    uses: ./.github/workflows/_publish.yml
    with:
      channel: stable
      # Share of users offered a new stable release at first. Raise it later from
      # Actions > "Set release rollout"; use 100 to release to everyone at once.
      rollout: 10
